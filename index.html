<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First PR Playground 🇱🇰</title><style>body{margin:0;background:#0f0f19;color:#fff;font-family:sans-serif;text-align:center}.hero{padding:70px 20px;background:radial-gradient(circle at 50% 0%,#ff6b0030,#0f0f19 70%)}h1{font-size:42px}h1 span{color:#ff6b00}.btn{padding:14px 28px;border-radius:30px;border:none;font-weight:bold;margin:8px}.b1{background:linear-gradient(90deg,#ff6b00,#ff9a00);color:#fff}.b2{background:#222;color:#fff;border:1px solid #555}.card{background:#1c1c2e;margin:15px auto;padding:20px;border-radius:20px;max-width:500px;border:1px solid #333;text-align:left}</style></head><body><div class="hero"><h1>First PR<br><span>Playground</span> 🇱🇰</h1><p>ලංකාවේ ලමයිට GitHub උගන්නන Game එක!</p><br><a href="https://github.com/ranasingeisukhitha-max/first-pr-playground-sinhala"><button class="btn b1">⭐ Star දාන්න</button></a><button class="btn b2" onclick="document.getElementById('lv').scrollIntoView({behavior:'smooth'})">🎮 පටන් ගමු</button></div><div id="lv" style="padding:20px"><h2>🗺️ Mission Map</h2><div class="card"><h3>🌟 Level 1: Star</h3><p>Star button එක ඔබන්න!</p><button class="btn b1" onclick="this.innerText='✅ Done! 🎉';c()">✅ දැම්මා</button></div><div class="card"><h3>🍴 Level 2: Fork</h3><p>Fork = copy එකක් හදාගන්න එක</p><button class="btn b1" onclick="this.innerText='✅ Done!'">✅ කළා</button></div><div class="card"><h3>📝 Level 3: නම දාන්න</h3><p>students/ folder එකේ file එකක් හදන්න</p><button class="btn b1" onclick="let n=prompt('ඔයාගේ නම?');if(n){alert('සුබ පැතුම් '+n+'! 🏆');c()}">🚀 PR දාන්න</button></div></div><script>function c(){for(let i=0;i<80;i++){let d=document.createElement('div');d.style.position='fixed';d.style.left=Math.random()*100+'%';d.style.top='-10px';d.style.width='10px';d.style.height='10px';d.style.background='hsl('+Math.random()*60+',100%,50%)';d.style.borderRadius='50%';d.style.zIndex=9999;document.body.appendChild(d);let t=0;let a=setInterval(()=>{d.style.top=t+'px';t+=6;if(t>innerHeight){clearInterval(a);d.remove()}},20)}}</script></body></html>
